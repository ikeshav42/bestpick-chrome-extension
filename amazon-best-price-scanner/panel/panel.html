<div class="abps-panel" id="abps-panel">
  <div class="abps-header" id="abps-drag-handle">
    <span class="abps-title">Amazon Best Price Scanner</span>
    <div class="abps-header-actions">
      <button id="abps-scan-again" class="abps-icon-btn" title="Re-scan">⟳</button>
      <button id="abps-close" class="abps-icon-btn" title="Close">✕</button>
    </div>
  </div>

  <div class="abps-blocked-banner" id="abps-blocked-banner" hidden>
    <div class="abps-blocked-text" id="abps-blocked-text">
      Amazon is temporarily limiting requests from this network.
    </div>
    <div class="abps-blocked-countdown" id="abps-blocked-countdown"></div>
  </div>

  <div class="abps-screen" id="abps-summary">
    <button class="abps-hero" id="abps-hero">
      <div class="abps-hero-label">Best Overall Price</div>
      <div class="abps-hero-price" id="abps-hero-price">—</div>
      <div class="abps-hero-meta" id="abps-hero-meta">Scanning…</div>
    </button>

    <div class="abps-cards" id="abps-cards">
      <button class="abps-card" data-condition="new">
        <div class="abps-card-label">New</div>
        <div class="abps-card-price" data-role="price">—</div>
        <div class="abps-card-name" data-role="name"></div>
      </button>
      <button class="abps-card" data-condition="like_new">
        <div class="abps-card-label">Like New</div>
        <div class="abps-card-price" data-role="price">—</div>
        <div class="abps-card-name" data-role="name"></div>
      </button>
      <button class="abps-card" data-condition="very_good">
        <div class="abps-card-label">Very Good</div>
        <div class="abps-card-price" data-role="price">—</div>
        <div class="abps-card-name" data-role="name"></div>
      </button>
      <button class="abps-card" data-condition="good">
        <div class="abps-card-label">Good</div>
        <div class="abps-card-price" data-role="price">—</div>
        <div class="abps-card-name" data-role="name"></div>
      </button>
      <button class="abps-card" data-condition="acceptable">
        <div class="abps-card-label">Acceptable</div>
        <div class="abps-card-price" data-role="price">—</div>
        <div class="abps-card-name" data-role="name"></div>
      </button>
    </div>
  </div>

  <div class="abps-screen" id="abps-detail" hidden>
    <button class="abps-back" id="abps-back">← Summary</button>

    <div class="abps-tabs" id="abps-tabs">
      <button class="abps-tab" data-condition="new">New</button>
      <button class="abps-tab" data-condition="like_new">Like New</button>
      <button class="abps-tab active" data-condition="very_good">Very Good</button>
      <button class="abps-tab" data-condition="good">Good</button>
      <button class="abps-tab" data-condition="acceptable">Acceptable</button>
    </div>

    <div class="abps-toolbar">
      <span class="abps-status" id="abps-status">Showing: — 0 variants</span>
      <select class="abps-sort" id="abps-sort" title="Sort by">
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="name_asc">Name: A–Z</option>
        <option value="name_desc">Name: Z–A</option>
      </select>
    </div>

    <div class="abps-table-wrap">
      <table class="abps-table">
        <tbody id="abps-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="abps-progress-wrap" id="abps-progress-wrap" hidden>
    <div class="abps-progress-bar">
      <div class="abps-progress-fill" id="abps-progress-fill"></div>
    </div>
    <span class="abps-progress-label" id="abps-progress-label">Fetching: 0 / 0</span>
  </div>
</div>
